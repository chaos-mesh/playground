images:
  registry: ghcr.io
  tag: v2.8.8

controllerManager:
  replicaCount: 1
  podChaos:
    podFailure:
      pauseImage: registry.k8s.io/pause:3.10.2

chaosDaemon:
  runtime: containerd
  socketPath: /run/containerd/containerd.sock
  image:
    registry: docker.io
    repository: playground/chaos-daemon
    tag: 2.8.8-toda-tproxy
  imagePullPolicy: Never

dnsServer:
  create: true

dashboard:
  create: false

prometheus:
  create: false
