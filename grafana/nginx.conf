map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;

    location = /_grafana_identity {
        internal;
        proxy_pass http://127.0.0.1:3000/api/user;
        proxy_method GET;
        proxy_set_header X-Grafana-Action "";
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location /playground-api/ {
        if ($http_x_grafana_action != "1") { return 403; }
        auth_request /_grafana_identity;
        proxy_set_header Origin "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_pass http://runner:8080/;
    }

    location /playground-controls/ {
        auth_request /_grafana_identity;
        alias /srv/playground-controls/;
        index controls.html;
        add_header Content-Security-Policy "default-src 'none'; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'self'" always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;

    location = /chaos-dashboard/current {
        if ($request_method != GET) { return 405; }
        auth_request /_grafana_identity;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header X-Frame-Options SAMEORIGIN always;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        set $playground_runner runner.playground-demo.svc.cluster.local:8080;
        proxy_pass http://$playground_runner/dashboard-current$is_args$args;
    }

    location /chaos-dashboard/ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        auth_request /_grafana_identity;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header X-Frame-Options SAMEORIGIN always;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        set $chaos_dashboard playground-chaos-dashboard.playground-demo.svc.cluster.local:2333;
        rewrite ^/chaos-dashboard/(.*)$ /$1 break;
        proxy_pass http://$chaos_dashboard$uri$is_args$args;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
