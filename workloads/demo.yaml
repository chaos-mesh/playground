apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: playground-podinfo
  template:
    metadata:
      labels:
        app: playground-podinfo
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.17.0
          ports:
            - containerPort: 9898
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9898
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo
spec:
  selector:
    app: playground-podinfo
  ports:
    - port: 9898
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: playground-blackbox
  template:
    metadata:
      labels:
        app: playground-blackbox
    spec:
      containers:
        - name: blackbox
          image: quay.io/prometheus/blackbox-exporter:v0.27.0
          ports:
            - containerPort: 9115
          readinessProbe:
            httpGet:
              path: /-/healthy
              port: 9115
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox
spec:
  selector:
    app: playground-blackbox
  ports:
    - port: 9115
